<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t1 d1">
<title id="t1">Example 1 — Add CSV export to notes app: native prose vs Shadow checkpoint</title>
<desc id="d1">Synthetic example. Left shows native prose with no evidence links. Right shows Shadow checkpoint with verified split, evidence refs, and explicit next step.</desc>
