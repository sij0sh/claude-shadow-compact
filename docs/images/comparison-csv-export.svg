<text x="600" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#24292f">Example 1 — Add CSV export to a notes app (synthetic, same session)</text>

